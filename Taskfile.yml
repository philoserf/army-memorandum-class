# Build and check armymemo.cls and its examples.
#
# Converted from the repo's single Makefile. Task names match the old targets
# one-for-one, so `make test` is now `task test` and so on -- with `build` added
# as a name for what used to be the bare default target.

version: "3"

vars:
  # latexmk runs with cwd=examples so the examples' relative paths resolve --
  # \documentclass{../armymemo}, \logo{../DOW-Seal-BW} and the symlinks beside
  # them. Kept as a `cd` rather than a task-level `dir:` on purpose: `dir:` also
  # reroots `sources:`, which would make the class and package fingerprints
  # resolve to the examples/ symlinks instead of the real files.
  LATEXMK: latexmk -lualatex

tasks:
  default:
    desc: Build every examples/*.pdf
    cmds:
      - task: build

  # The example list is gathered by shell rather than declared as this task's
  # `sources:`. The bare `for: sources` form would work, but giving this task
  # `sources:` also enrolls it in Task's own up-to-date check -- and with no
  # `generates:` to compare against, a second `task build` would skip the loop
  # entirely even when a PDF had been deleted. The per-example check belongs on
  # build:one, which has both halves.
  #
  # Serial on purpose. The Makefile asked for `-j4` -- bounded, not unbounded --
  # because thirteen examples against unlimited parallelism can race on a cold
  # luaotfload font-names cache. A `for` loop in `cmds:` runs one at a time, which
  # is strictly safer and measurably slower. If you reach for parallelism here,
  # that race is what you have to bound; do not convert this into unbounded
  # `deps:` fan-out and assume it is free.
  build:
    desc: Build every examples/*.pdf
    vars:
      TEXFILES:
        sh: ls examples/*.tex
    cmds:
      - for:
          var: TEXFILES
          split: "\n"
          as: TEX
        task: build:one
        vars:
          TEX: "{{.TEX}}"

  # One example. Split out so each PDF gets its own up-to-date check, which is
  # what the Makefile's pattern rule gave us.
  #
  # The class and the bundled package are real sources, so editing either
  # rebuilds the PDFs. They were once prerequisites of the `all` target rather
  # than of the pattern rule, which meant a class change left every PDF stale
  # and `make clean && make` was the documented workaround. Keep them listed
  # here; dropping them silently brings that bug back.
  build:one:
    internal: true
    label: "build {{base .TEX}}"
    sources:
      - "{{.TEX}}"
      - armymemo.cls
      - digsig.sty
    generates:
      - '{{.TEX | replace ".tex" ".pdf"}}'
    cmds:
      - cd examples && {{.LATEXMK}} {{base .TEX}}

  # Deliberately has no `sources:`. It would look natural -- the Makefile rule was
  # `check: armymemo.cls` -- but that was a prerequisite on a .PHONY target, which
  # always ran. In Task, `sources:` without `generates:` enrolls the task in the
  # up-to-date check, and the whole point of check is to read chktex's output every
  # time. It does not bite today only because chktex exits 2 on the 26 warnings and
  # Task records a fingerprint only on success; drive the count to zero and `task
  # check` would start reporting "up to date" and skipping.
  check:
    desc: Run chktex against armymemo.cls
    cmds:
      - chktex armymemo.cls

  # Lints the repo's *tooling*, not the LaTeX. `check` (chktex) and the chktex
  # ratchet inside `test` cover armymemo.cls; this covers the Python and shell
  # that build and test it, which nothing else looks at.
  #
  # ruff runs through `uvx` because it is not installed and is not in the global
  # .Brewfile -- uvx fetches and caches it on first use. shellcheck and shfmt are
  # in the .Brewfile and are expected on PATH.
  #
  # shfmt runs as `-d` (diff, non-zero on drift) with no -i/-ci flags on purpose:
  # bare shfmt reads .editorconfig, and passing any formatting flag would make it
  # ignore that file. See .editorconfig for the precedence rule.
  lint:
    desc: Lint and format-check the Python and shell tooling
    cmds:
      - uvx ruff check tools/
      - uvx ruff format --check tools/
      - shellcheck tools/*.sh
      - shfmt -d tools/*.sh

  # Rendering regression harness: rebuilds every example and diffs the extracted
  # text, page count and class diagnostics against examples/golden/.
  #
  # It drives latexmk itself rather than going through this file, exactly as it
  # refused to go through the Makefile, so that a stale-PDF bug here could never
  # make the tests pass when they should fail. Do not "simplify" this into a
  # dependency on `build`.
  test:
    desc: Rendering regression harness -- the real check
    cmds:
      - sh tools/run-tests.sh

  golden:
    desc: Recapture the golden files after an intended output change
    cmds:
      - sh tools/run-tests.sh --update

  # example*.pdf is deliberately narrower than *.pdf: DODb1.pdf in that directory
  # is a tracked symlink to build input, not output.
  clean:
    desc: Remove built PDFs and aux files
    cmds:
      - rm -f examples/example*.pdf
      - >-
        cd examples && rm -f
        *-blx.bib *.aux *.bbl *.bcf *.blg *.brf *.dvi
        *.ent *.fdb_latexmk *.fls *.idx *.ilg *.ind *.lof *.log
        *.lot *.orig *.rtf *.run.xml *.toc *.url

  proper:
    desc: clean, and also remove *.out
    cmds:
      - task: clean
      - rm -f examples/*.out
